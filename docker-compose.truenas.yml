# Jellyfish on TrueNAS: MongoDB, mongo-express and the API (which also serves the web client).
#
#   cp .env.example .env    # then fill it in
#
# The image is published by CI (.github/workflows/ci.yml): "latest" follows main; pin JELLYFISH_TAG in .env to a
# sha-<commit> or X.Y.Z tag for repeatable deploys.

x-image: &image ${JELLYFISH_IMAGE:-ghcr.io/rshouse3956/jellyfish}:${JELLYFISH_TAG:-latest}

services:
  mongo:
    image: mongo:8
    container_name: jellyfish-mongo
    restart: unless-stopped
    # Publish Mongo only if another machine needs it (e.g. Compass); the API reaches it on the compose network.
    # ports:
    #   - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
      # Recommended on TrueNAS: bind mount to a dataset instead of a named volume
      # - /mnt/pool/apps/jellyfish/mongo:/data/db

  # Optional admin UI — disable on production if not needed
  mongo-express:
    image: mongo-express
    container_name: jellyfish-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin
      # Login for the web UI (set ME_USER and ME_PASS in .env)
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:?Set ME_USER in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:?Set ME_PASS in .env}

  jellyfish-api:
    image: *image
    container_name: jellyfish-api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      # Host 8085 → container 5300 (Kestrel HTTP)
      - "8085:5300"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Mongo__ConnectionString=mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin
      - Mongo__DatabaseName=${DB_NAME:-jellyfish}
      # Location for sunrise/sunset schedules (decimal degrees, metres)
      - Schedule__Latitude=${SCHEDULE_LATITUDE:?Set SCHEDULE_LATITUDE in .env}
      - Schedule__Longitude=${SCHEDULE_LONGITUDE:?Set SCHEDULE_LONGITUDE in .env}
      - Schedule__ElevationMeters=${SCHEDULE_ELEVATION_METERS:-0}
      # Controller address, e.g. CONTROLLER_WS_URI=ws://10.0.0.x:9000/ws in .env
      - JellyfishController__WebSocketUri=${CONTROLLER_WS_URI:?Set CONTROLLER_WS_URI in .env}
      # Pattern assistant (off unless PATTERN_ASSISTANT_ENABLED=true in .env). OLLAMA_BASE_URL can point at the
      # ollama service below or at Ollama on another machine (e.g. a desktop with a GPU).
      - PatternAssistant__Enabled=${PATTERN_ASSISTANT_ENABLED:-false}
      - PatternAssistant__BaseUrl=${OLLAMA_BASE_URL:-http://ollama:11434}
      - PatternAssistant__Model=${OLLAMA_MODEL:-qwen2.5:7b}

  # Optional: Ollama on TrueNAS itself (CPU-only replies take ~5-20 s with a 7B model and ~6-8 GB RAM).
  # Uncomment, redeploy, then: docker exec jellyfish-ollama ollama pull qwen2.5:7b
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: jellyfish-ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #     # Recommended on TrueNAS: bind mount to a dataset instead
  #     # - /mnt/pool/apps/jellyfish/ollama:/root/.ollama

volumes:
  mongo_data:
  # ollama_data:

